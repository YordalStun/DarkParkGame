# Builds the Windows game folder (DarkPark.exe + browser engine) on every push and attaches it to the run
# (Actions tab -> latest run -> Artifacts -> DarkPark-windows).
# Pushing a version tag (v0.2.0, ...) also publishes a GitHub Release with the zip,
# using docs/releases/<tag>.md as the release notes.
name: Build game

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and the Windows export template
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dest
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
            templates/windows_release_x86_64.exe templates/version.txt -d $dest
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Fetch the Chromium web engine
        run: tools/fetch_cef.sh

      - name: Export and package
        run: |
          godot=./Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $godot --headless --path . --import
          tools/package_windows.sh $godot build/windows
          test -f build/windows/DarkPark/DarkPark.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DarkPark-windows
          path: build/windows/DarkPark/

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Dark Park ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: build/windows/DarkPark-windows.zip
