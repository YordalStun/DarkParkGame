<!doctype html>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Dark Park To-Do</title>
<style>
/* Layout: one narrow column, sections stacked, progress pinned at the top. */
:root {
  --bg: #f4f1ea;
  --surface: #fffdf8;
  --fg: #22201c;
  --muted: #6d675d;
  --line: #d9d2c3;
  --accent: #3c6e5a;
  --done: #9a9488;
  --ring: #3c6e5a;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a;
    --surface: #1f2123;
    --fg: #ece8df;
    --muted: #9b968b;
    --line: #34363a;
    --accent: #8fc2a8;
    --done: #6f6a60;
    --ring: #8fc2a8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181a;
  --surface: #1f2123;
  --fg: #ece8df;
  --muted: #9b968b;
  --line: #34363a;
  --accent: #8fc2a8;
  --done: #6f6a60;
  --ring: #8fc2a8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
  line-height: 1.5;
}
main { max-width: 640px; margin: 0 auto; min-width: 0; }
header h1 {
  font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
  font-size: 1.9rem;
  margin: 0 0 4px;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.progress {
  margin: 20px 0 28px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.bar {
  flex: 1;
  height: 8px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.bar > span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width 0.3s ease;
}
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; min-width: 4.5em; text-align: right; }
section { margin-bottom: 24px; min-width: 0; }
h2 {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 600;
  margin: 0 0 8px;
}
ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
li + li { border-top: 1px solid var(--line); }
label {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 14px;
  cursor: pointer;
  min-width: 0;
}
label span { overflow-wrap: anywhere; min-width: 0; }
input[type="checkbox"] {
  flex: none;
  width: 18px;
  height: 18px;
  margin: 2px 0 0;
  accent-color: var(--ring);
}
input[type="checkbox"]:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
li.done span { color: var(--done); text-decoration: line-through; }
.empty { color: var(--muted); font-style: italic; padding: 12px 14px; }
.note { font-size: 0.8rem; color: var(--muted); margin-top: 28px; }
.err { color: var(--fg); background: var(--surface); border: 1px dashed var(--line); padding: 14px; border-radius: 10px; }
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>

<main>
  <header>
    <h1>Dark Park To-Do</h1>
    <p>Read from TODO.md in the repo. Ticking a box here does not change the file.</p>
  </header>

  <div class="progress" aria-live="polite">
    <div class="bar"><span id="fill"></span></div>
    <div class="count" id="count">0 / 0</div>
  </div>

  <div id="sections"></div>
  <p class="note">Edit TODO.md and commit it. Then republish this page to refresh the copy here.</p>
</main>

<script>
(function () {
  var fill = document.getElementById("fill");
  var count = document.getElementById("count");
  var root = document.getElementById("sections");

  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function parse(md) {
    var sections = [];
    var cur = null;
    md.split(/\r?\n/).forEach(function (line) {
      var h = /^##\s+(.*)$/.exec(line);
      var t = /^\s*[-*]\s+\[([ xX])\]\s+(.*)$/.exec(line);
      if (h) {
        cur = { title: h[1].trim(), items: [] };
        sections.push(cur);
      } else if (t && cur) {
        cur.items.push({ done: t[1].toLowerCase() === "x", text: t[2].trim() });
      }
    });
    return sections;
  }

  function update() {
    var boxes = root.querySelectorAll("input[type=checkbox]");
    var done = 0;
    boxes.forEach(function (b) {
      b.closest("li").classList.toggle("done", b.checked);
      if (b.checked) done++;
    });
    var total = boxes.length;
    count.textContent = done + " / " + total;
    fill.style.width = total ? (done / total * 100) + "%" : "0";
  }

  function render(sections) {
    var html = "";
    sections.forEach(function (s) {
      html += "<section><h2>" + esc(s.title) + "</h2>";
      if (!s.items.length) {
        html += '<ul><li class="empty">Nothing here yet.</li></ul>';
      } else {
        html += "<ul>";
        s.items.forEach(function (it) {
          html += '<li class="' + (it.done ? "done" : "") + '"><label><input type="checkbox"' +
            (it.done ? " checked" : "") + "><span>" + esc(it.text) + "</span></label></li>";
        });
        html += "</ul>";
      }
      html += "</section>";
    });
    root.innerHTML = html;
    root.addEventListener("change", update);
    update();
  }

  fetch("TODO.md")
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (md) { render(parse(md)); })
    .catch(function () {
      root.innerHTML = '<div class="err">Could not load TODO.md. Republish this page with TODO.md beside it.</div>';
    });
})();
</script>
